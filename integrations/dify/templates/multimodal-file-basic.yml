# =============================================================================
# Dify 多模态知识流水线 · 基础模板
# -----------------------------------------------------------------------------
# 适用版本 : Dify 1.17.x（Knowledge Pipeline，DSL 0.1.0，kind: rag_pipeline）
# 流水线   : 文件上传 → 多模态提取(文本+内嵌图片) → 通用分块 → 知识库索引(视觉向量)
# -----------------------------------------------------------------------------
# 多模态原理（重要）:
#   1. Dify Extractor 解析 PDF/PPTX 时，会把文档内嵌图片抽出来上传到 Dify 存储，
#      并在正文中以 Markdown 图片链接 ![](/files/<id>/file-preview) 的形式插回。
#   2. 通用分块把正文切块，图片链接自然保留在对应块内。
#   3. 知识库索引节点只要使用「带 vision 特性的 embedding 模型」，Dify 就会把
#      dataset.is_multimodal 置为 True，并调用 vector.create_multimodal()，
#      把图片和文本一起编码进同一个向量空间。
#   所以：多模态能力 = 支持抽图的提取器 + 视觉 embedding 模型，两者缺一不可。
# -----------------------------------------------------------------------------
# 依赖插件（import 时会自动校验/提示安装）:
#   - langgenius/dify_extractor   0.1.1   （多模态提取器，抽文本 + 文档内嵌图片）
#   - langgenius/general_chunker  0.0.14  （通用文本分块）
#   - langgenius/tongyi           0.2.22  （视觉 embedding，本模板用 multimodal-embedding-v1）
# =============================================================================
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/dify_extractor:0.1.1@e9767479e2a3817963132ed39d6fbd5ed61c204c2db574d2292cf1fc663db487
    version: null
- current_identifier: null
