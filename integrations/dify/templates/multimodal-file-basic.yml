    #   本模板用通义 multimodal-embedding-v1（features: [vision]）。
    #   换成纯文本模型（如 text-embedding-v4）则退化为普通文本知识库。
    # ---------------------------------------------------------------------
    - data:
        chunk_structure: text_model
        embedding_model: multimodal-embedding-v1
        embedding_model_provider: langgenius/tongyi/tongyi
