# =============================================================================
# Dify 多模态知识流水线 · MinerU OCR 变体
# -----------------------------------------------------------------------------
# 适用版本 : Dify 1.17.x（Knowledge Pipeline，DSL 0.1.0，kind: rag_pipeline）
# 流水线   : 文件/图片 → MinerU 解析(OCR+公式+表格+图片) → 通用分块 → 视觉向量索引
# -----------------------------------------------------------------------------
# 与基础版的区别:
#   - 提取器换成 MinerU，适合「扫描件 / 图片型 PDF / 纯图片」，可 OCR 并抽取版面图片
#   - 数据源额外允许 png / jpg / jpeg 直接上传
#   - tool_configurations 中默认开启 enable_ocr / enable_formula / enable_table
#
# 前置条件（重要）:
#   MinerU 需要先在「设置 → 工具」里配置服务地址与令牌：
#     server_type : local（自建 MinerU 服务） 或 remote（MinerU 官方 API）
#     base_url    : MinerU 服务地址
#     token       : 官方 API 需要，自建可留空
#   未配置时流水线可以导入，但运行会失败。
#
# 依赖插件: langgenius/mineru 0.5.0 + langgenius/general_chunker 0.0.14 + langgenius/tongyi 0.2.22
# =============================================================================
